# vim:ft=kitty

# Colours: generated by ~/.config/theme/apply.py
include current-theme.conf

enable_audio_bell       no
background_opacity      0.9
background_blur         64

# Padding
window_padding_width    4 0

# BEGIN_KITTY_FONTS
font_family      family="FiraCode Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
